<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHENZHEN & HONG KONG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ④ メニューボタン群をアニメーションなしで常時表示 */
    .top-nav,
    .top-nav * {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
      visibility: visible !important;
    }

    .top-nav {
      display: flex;
      flex-direction: column;
    }

    /* ① DAY 1 / 2 / 3 を20〜30px下げる */
    .primary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 25px;
      margin-bottom: 14px;
    }

    /* ② FOOD / SIGHTS / TRANSIT の高さをさらに5〜10%小さく */
    .secondary-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      /* ③ 3段目との縦間隔を15〜20px広げる */
      margin-bottom: 18px;
    }

    .secondary-row-3 .btn-secondary {
      padding-top: 6px !important;
      padding-bottom: 6px !important;
      min-height: unset !important;
      font-size: 11px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    /* 3段目：TODO / EXPENSES */
    .secondary-row-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
  </style>
</head>
<body class="top-page">

  <main class="hero-section">
    <img src="IMG_3110.jpeg" alt="Shenzhen & Hong Kong" class="hero-img">
    
    <!-- UI周辺を読みやすくするグラデーション -->
    <div class="hero-overlay"></div>

    <div class="hero-content">
      
      <!-- タイトルグループ（位置を約40px上へ移動） -->
      <div class="hero-title-group">
        <h1 class="hero-title title-shenzhen">SHENZHEN</h1>
        <h1 class="hero-title title-hongkong">HONG KONG</h1>
      </div>

      <!-- サブタイトル -->
      <p class="hero-sub">TRAVEL ITINERARY</p>

      <!-- ボタン群 -->
      <nav class="top-nav">
        <!-- 1段目：DAY選択タブ (位置下げ) -->
        <div class="nav-row primary-row">
          <a href="day1.html" class="btn btn-primary active">DAY 1</a>
          <a href="day2.html" class="btn btn-primary">DAY 2</a>
          <a href="day3.html" class="btn btn-primary">DAY 3</a>
        </div>

        <!-- 2段目：FOOD / SIGHTS / TRANSIT (高さ縮小) -->
        <div class="secondary-row-3">
          <a href="foods.html" class="btn btn-secondary">FOOD</a>
          <a href="landmark.html" class="btn btn-secondary">SIGHTS</a>
          <a href="traffic.html" class="btn btn-secondary">TRANSIT</a>
        </div>

        <!-- 3段目：TODO / EXPENSES (縦間隔広げる) -->
        <div class="secondary-row-2">
          <a href="todo.html" class="btn btn-secondary">TODO</a>
          <a href="expenses.html" class="btn btn-secondary">EXPENSES</a>
        </div>
      </nav>

    </div>
  </main>

  <script>
    document.querySelectorAll('.btn-primary').forEach(button => {
      button.addEventListener('click', function(e) {
        document.querySelectorAll('.btn-primary').forEach(btn => btn.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
