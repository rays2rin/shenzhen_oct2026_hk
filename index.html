<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHENZHEN & HONG KONG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* 追加ボタンレイアウト調整用スタイル */
    .secondary-row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .secondary-row-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
  </style>
</head>
<body class="top-page">

  <main class="hero-section">
    <img src="IMG_3110.jpeg" alt="Shenzhen & Hong Kong" class="hero-img">
    
    <!-- UI周辺を読みやすくするグラデーション -->
    <div class="hero-overlay"></div>

    <div class="hero-content">
      
      <!-- タイトルグループ（位置を約40px上へ移動） -->
      <div class="hero-title-group">
        <h1 class="hero-title title-shenzhen">SHENZHEN</h1>
        <h1 class="hero-title title-hongkong">HONG KONG</h1>
      </div>

      <!-- サブタイトル -->
      <p class="hero-sub">TRAVEL ITINERARY</p>

      <!-- ボタン群 -->
      <nav class="top-nav">
        <!-- 1段目：DAY選択タブ -->
        <div class="nav-row primary-row">
          <a href="day1.html" class="btn btn-primary active">DAY 1</a>
          <a href="day2.html" class="btn btn-primary">DAY 2</a>
          <a href="day3.html" class="btn btn-primary">DAY 3</a>
        </div>

        <!-- 2段目：FOOD / SIGHTSEEING / TRANSPORTATION -->
        <div class="secondary-row-3">
          <a href="foods.html" class="btn btn-secondary">FOOD</a>
          <a href="landmark.html" class="btn btn-secondary">SIGHTSEEING</a>
          <a href="traffic.html" class="btn btn-secondary">TRANSPORTATION</a>
        </div>

        <!-- 3段目：TODO / EXPENSES -->
        <div class="secondary-row-2">
          <a href="todo.html" class="btn btn-secondary">TODO</a>
          <a href="expenses.html" class="btn btn-secondary">EXPENSES</a>
        </div>
      </nav>

    </div>
  </main>

  <script>
    document.querySelectorAll('.btn-primary').forEach(button => {
      button.addEventListener('click', function(e) {
        document.querySelectorAll('.btn-primary').forEach(btn => btn.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
