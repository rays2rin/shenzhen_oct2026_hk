<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROUTE MAP - Shenzhen & Hong Kong</title>

  <!-- フォント読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fcfcf9;
      color: #202A3A;
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ナビゲーションバー */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #edf2f7;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-icon {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bar {
      width: 20px;
      height: 2px;
      background-color: #202A3A;
      border-radius: 2px;
    }

    .site-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #202A3A;
    }

    /* ドロワーメニュー */
    .drawer-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: #ffffff;
      z-index: 300;
      transition: left 0.3s ease;
      padding: 24px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }

    .drawer-menu.active { left: 0; }

    .close-btn {
      font-size: 20px;
      cursor: pointer;
      text-align: right;
      margin-bottom: 20px;
      color: #718096;
    }

    .drawer-menu ul { list-style: none; }
    .drawer-menu li { margin-bottom: 16px; }
    .drawer-menu a {
      text-decoration: none;
      color: #202A3A;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .drawer-menu .divider {
      height: 1px;
      background-color: #edf2f7;
      margin: 16px 0;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      display: none;
    }
    .overlay.active { display: block; }

    /* メインレイアウト */
    .page-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* 戻るボタン */
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 12px;
      color: #718096;
      text-decoration: none;
    }

    .back-link:hover {
      color: #202A3A;
    }

    /* 路線図画像エリア */
    .map-container {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e2d5;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <!-- ドロワーメニュー -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- メインコンテンツ -->
  <main class="page-container">
    <a href="traffic.html" class="back-link">← 移動手段（traffic）に戻る</a>
    
    <div class="map-container">
      <img src="IMG_3205.jpeg" alt="路線図" class="map-image">
    </div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
  </script>
</body>
</html>
