<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAMCHA - Shenzhen & Hong Kong</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fcfcf9;
      color: #202A3A;
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* ナビゲーションバー */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #edf2f7;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-icon {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bar {
      width: 20px;
      height: 2px;
      background-color: #202A3A;
      border-radius: 2px;
    }

    .site-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #202A3A;
    }

    /* ドロワーメニュー */
    .drawer-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: #ffffff;
      z-index: 300;
      transition: left 0.3s ease;
      padding: 24px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }

    .drawer-menu.active { left: 0; }

    .close-btn {
      font-size: 20px;
      cursor: pointer;
      text-align: right;
      margin-bottom: 20px;
      color: #718096;
    }

    .drawer-menu ul { list-style: none; }
    .drawer-menu li { margin-bottom: 16px; }
    .drawer-menu a {
      text-decoration: none;
      color: #202A3A;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .drawer-menu .divider {
      height: 1px;
      background-color: #edf2f7;
      margin: 16px 0;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      display: none;
    }
    .overlay.active { display: block; }

    /* メインレイアウト */
    .page-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* 戻るボタン */
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 12px;
      color: #718096;
      text-decoration: none;
    }

    .header-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 700;
      color: #1f2b1a;
      letter-spacing: 2px;
    }

    .page-sub {
      font-size: 12px;
      color: #718096;
      margin-top: 4px;
    }

    /* 店舗カードコンテナ */
    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 店舗ごとのカード */
    .shop-card {
      background: #ffffff;
      border: 1px solid #e5e2d5;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* スライドショーコンテナ */
    .slider-container {
      position: relative;
      width: 100%;
      height: 180px; /* 高さを抑える */
      overflow: hidden;
      background-color: #f0f0f0;
    }

    .slider-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* 矢印ボタン */
    .prev-btn, .next-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      border: none;
      font-size: 18px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      z-index: 10;
      user-select: none;
    }

    .prev-btn { left: 8px; }
    .next-btn { right: 8px; }

    .prev-btn:hover, .next-btn:hover {
      background: rgba(0, 0, 0, 0.6);
    }

    /* ドットナビゲーション */
    .dots-container {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .dot.active {
      background: #ffffff;
      width: 14px;
      border-radius: 4px;
    }

    /* カード本体コンテンツ */
    .card-body {
      padding: 16px;
    }

    /* 店名と支店名の横並びヘッダー */
    .shop-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0ede0;
      padding-bottom: 8px;
    }

    .shop-name {
      font-size: 24px;
      font-weight: 700;
      color: #1e2d1d;
      line-height: 1.2;
    }

    .branch-name {
      font-size: 14px;
      color: #666666;
      font-weight: 500;
    }

    /* 店舗詳細情報 */
    .shop-info-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: #4a5568;
      line-height: 1.5;
    }

    .info-item {
      display: flex;
      gap: 6px;
    }

    .info-label {
      font-weight: bold;
      color: #202A3A;
      min-width: 70px;
    }

    .shop-desc {
      margin-top: 10px;
      font-size: 11px;
      color: #666;
      background: #fcfcf9;
      padding: 8px 10px;
      border-radius: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <main class="page-container">
    <a href="foods.html" class="back-link">← グルメ一覧（foods）に戻る</a>

    <div class="header-section">
      <h1 class="page-title">DIM SUM</h1>
      <p class="page-sub">本場・深圳＆香港のおすすめ飲茶・点心スポット</p>
    </div>

    <div class="shop-list">

      <!-- 店舗1：陶陶居酒家 -->
      <div class="shop-card">
        <div class="slider-container" id="slider1">
          <div class="slider-wrapper">
            <img src="IMG_3123.jpeg" alt="陶陶居 1" class="slide active">
            <img src="IMG_3121.jpeg" alt="陶陶居 2" class="slide">
            <img src="IMG_3124.jpeg" alt="陶陶居 3" class="slide">
          </div>
          <button class="prev-btn" onclick="moveSlide('slider1', -1)">‹</button>
          <button class="next-btn" onclick="moveSlide('slider1', 1)">›</button>
          <div class="dots-container">
            <span class="dot active" onclick="setSlide('slider1', 0)"></span>
            <span class="dot" onclick="setSlide('slider1', 1)"></span>
            <span class="dot" onclick="setSlide('slider1', 2)"></span>
          </div>
        </div>
        <div class="card-body">
          <div class="shop-header">
            <span class="shop-name">陶陶居酒家</span>
            <span class="branch-name">（卓悦中心店）</span>
          </div>
          <div class="shop-info-list">
            <div class="info-item">
              <span class="info-label">営業時間</span>
              <span>10:00〜</span>
            </div>
            <div class="info-item">
              <span class="info-label">アクセス</span>
              <span>ホテルから徒歩30分 (1.8km)</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 店舗2：利宝阁 -->
      <div class="shop-card">
        <div class="slider-container" id="slider2">
          <div class="slider-wrapper">
            <img src="IMG_3126.jpeg" alt="利宝阁 1" class="slide active">
            <img src="IMG_3125.jpeg" alt="利宝阁 2" class="slide">
            <img src="IMG_3127.jpeg" alt="利宝阁 3" class="slide">
          </div>
          <button class="prev-btn" onclick="moveSlide('slider2', -1)">‹</button>
          <button class="next-btn" onclick="moveSlide('slider2', 1)">›</button>
          <div class="dots-container">
            <span class="dot active" onclick="setSlide('slider2', 0)"></span>
            <span class="dot" onclick="setSlide('slider2', 1)"></span>
            <span class="dot" onclick="setSlide('slider2', 2)"></span>
          </div>
        </div>
        <div class="card-body">
          <div class="shop-header">
            <span class="shop-name">利宝阁</span>
            <span class="branch-name">（嘉里建設広場店）</span>
          </div>
          <div class="shop-info-list">
            <div class="info-item">
              <span class="info-label">営業時間</span>
              <span>9:00〜</span>
            </div>
            <div class="info-item">
              <span class="info-label">アクセス</span>
              <span>ホテルから徒歩23分 (1.3km)</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    // スライドショー制御ロジック
    const slideIndexes = {
      slider1: 0,
      slider2: 0
    };

    function showSlide(sliderId, index) {
      const slider = document.getElementById(sliderId);
      const slides = slider.querySelectorAll('.slide');
      const dots = slider.querySelectorAll('.dot');
      
      if (index >= slides.length) slideIndexes[sliderId] = 0;
      else if (index < 0) slideIndexes[sliderId] = slides.length - 1;
      else slideIndexes[sliderId] = index;

      const currentIndex = slideIndexes[sliderId];

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentIndex);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function moveSlide(sliderId, step) {
      showSlide(sliderId, slideIndexes[sliderId] + step);
    }

    function setSlide(sliderId, index) {
      showSlide(sliderId, index);
    }
  </script>
</body>
</html>
