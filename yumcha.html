<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAMCHA - Shenzhen & Hong Kong</title>

  <!-- フォント読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fcfcf9;
      color: #202A3A;
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* ナビゲーションバー */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #edf2f7;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-icon {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bar {
      width: 20px;
      height: 2px;
      background-color: #202A3A;
      border-radius: 2px;
    }

    .site-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #202A3A;
    }

    /* ドロワーメニュー */
    .drawer-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: #ffffff;
      z-index: 300;
      transition: left 0.3s ease;
      padding: 24px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }

    .drawer-menu.active { left: 0; }

    .close-btn {
      font-size: 20px;
      cursor: pointer;
      text-align: right;
      margin-bottom: 20px;
      color: #718096;
    }

    .drawer-menu ul { list-style: none; }
    .drawer-menu li { margin-bottom: 16px; }
    .drawer-menu a {
      text-decoration: none;
      color: #202A3A;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .drawer-menu .divider {
      height: 1px;
      background-color: #edf2f7;
      margin: 16px 0;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      display: none;
    }
    .overlay.active { display: block; }

    /* メインレイアウト */
    .page-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* 戻るボタン */
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 12px;
      color: #718096;
      text-decoration: none;
    }

    .header-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      color: #1f2b1a;
      letter-spacing: 2px;
    }

    .page-sub {
      font-size: 11px;
      color: #718096;
      margin-top: 4px;
    }

    /* 店舗カードコンテナ */
    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 店舗ごとのカード */
    .shop-card {
      background: #ffffff;
      border: 1px solid #e5e2d5;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* スライドショーコンテナ（高さ抑えめ） */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      background-color: #f0f0f0;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease-in-out;
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* スライド矢印ボタン */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.7);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #202A3A;
      z-index: 10;
    }
    .carousel-arrow.prev { left: 8px; }
    .carousel-arrow.next { right: 8px; }

    /* スライドドット指示器 */
    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
    }
    .dot.active {
      background: #ffffff;
    }

    /* カード本体コンテンツ */
    .card-body {
      padding: 14px 16px;
    }

    /* 店名と支店名ヘッダー */
    .shop-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f0ede0;
    }

    .shop-name {
      font-family: 'Shippori Mincho', serif;
      font-size: 20px;
      font-weight: 700;
      color: #1e2d1d;
      letter-spacing: 0.5px;
    }

    .branch-name {
      font-size: 13px;
      color: #718096;
      font-weight: 400;
    }

    /* 店舗詳細情報（エリア・営業時間のみ） */
    .shop-info-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #4a5568;
    }

    .info-item {
      display: flex;
      gap: 8px;
    }

    .info-label {
      font-weight: 500;
      color: #718096;
      min-width: 50px;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <!-- ドロワーメニュー -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- メインコンテンツ -->
  <main class="page-container">
    <a href="foods.html" class="back-link">← グルメ一覧（foods）に戻る</a>

    <div class="header-section">
      <h1 class="page-title">DIM SUM</h1>
      <p class="page-sub">おすすめの飲茶・点心スポット</p>
    </div>

    <div class="shop-list">

      <!-- 店舗 1: 陶陶居 -->
      <div class="shop-card">
        <div class="carousel-container" id="carousel-1">
          <div class="carousel-track">
            <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80" alt="陶陶居 1"></div>
            <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1541696432-82c6da8ce7bf?auto=format&fit=crop&w=800&q=80" alt="陶陶居 2"></div>
          </div>
          <button class="carousel-arrow prev" onclick="moveSlide('carousel-1', -1)">❮</button>
          <button class="carousel-arrow next" onclick="moveSlide('carousel-1', 1)">❯</button>
          <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>
        </div>
        <div class="card-body">
          <div class="shop-header">
            <span class="shop-name">陶陶居</span>
            <span class="branch-name">卓悦中心店</span>
          </div>
          <div class="shop-info-list">
            <div class="info-item">
              <span class="info-label">エリア</span>
              <span>深圳 / 福田区</span>
            </div>
            <div class="info-item">
              <span class="info-label">営業時間</span>
              <span>10:00 - 21:30</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 店舗 2: 点都徳 -->
      <div class="shop-card">
        <div class="carousel-container" id="carousel-2">
          <div class="carousel-track">
            <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1541696432-82c6da8ce7bf?auto=format&fit=crop&w=800&q=80" alt="点都徳 1"></div>
            <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=800&q=80" alt="点都徳 2"></div>
          </div>
          <button class="carousel-arrow prev" onclick="moveSlide('carousel-2', -1)">❮</button>
          <button class="carousel-arrow next" onclick="moveSlide('carousel-2', 1)">❯</button>
          <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>
        </div>
        <div class="card-body">
          <div class="shop-header">
            <span class="shop-name">点都徳</span>
            <span class="branch-name">華強北店</span>
          </div>
          <div class="shop-info-list">
            <div class="info-item">
              <span class="info-label">エリア</span>
              <span>深圳 / 華強北</span>
            </div>
            <div class="info-item">
              <span class="info-label">営業時間</span>
              <span>08:00 - 22:00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 店舗 3: 蘩楼 -->
      <div class="shop-card">
        <div class="carousel-container" id="carousel-3">
          <div class="carousel-track">
            <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=800&q=80" alt="蘩楼 1"></div>
            <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80" alt="蘩楼 2"></div>
          </div>
          <button class="carousel-arrow prev" onclick="moveSlide('carousel-3', -1)">❮</button>
          <button class="carousel-arrow next" onclick="moveSlide('carousel-3', 1)">❯</button>
          <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>
        </div>
        <div class="card-body">
          <div class="shop-header">
            <span class="shop-name">蘩楼</span>
            <span class="branch-name">華強北本店</span>
          </div>
          <div class="shop-info-list">
            <div class="info-item">
              <span class="info-label">エリア</span>
              <span>深圳 / 華強北</span>
            </div>
            <div class="info-item">
              <span class="info-label">営業時間</span>
              <span>08:00 - 22:00</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    /* スライドショー操作JS */
    const slideState = {};

    function moveSlide(containerId, direction) {
      const container = document.getElementById(containerId);
      const track = container.querySelector('.carousel-track');
      const slides = container.querySelectorAll('.carousel-slide');
      const dots = container.querySelectorAll('.dot');
      
      if (!(containerId in slideState)) {
        slideState[containerId] = 0;
      }

      let currentIndex = slideState[containerId];
      currentIndex += direction;

      if (currentIndex < 0) {
        currentIndex = slides.length - 1;
      } else if (currentIndex >= slides.length) {
        currentIndex = 0;
      }

      slideState[containerId] = currentIndex;
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }
  </script>
</body>
</html>
