<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUM CHA - Shenzhen & Hong Kong</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- フォント調整・カードレイアウト用スタイル -->
  <style>
    /* 画像を横長＆高さを従来の約7割（180px程度）に調整 */
    .slider-container {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      background-color: #f0f0f0;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .slider-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* 店舗カード調整 */
    .yumcha-card {
      background: #ffffff;
      border: 1px solid #e5e2d5;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .yumcha-info {
      padding: 16px;
    }

    /* 店名・支店名のレイアウト（店名20px、支店名を同じ行に配置） */
    .yumcha-name {
      font-size: 20px;
      font-weight: 700;
      color: #1e2d1d;
      margin-bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .branch-name {
      font-size: 13px;
      color: #718096;
      font-weight: normal;
    }

    .yumcha-meta p {
      font-size: 12px;
      color: #4a5568;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <!-- ドロワーメニュー -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <!-- バックドロップ -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- メインコンテンツ -->
  <main class="page-container">
    
    <!-- タイトルヘッダー -->
    <div class="schedule-header">
      <p class="schedule-sub">DAY 1 BREAKFAST / LUNCH</p>
      <h1 class="schedule-title">DIM SUM SPOT</h1>
    </div>

    <div class="yumcha-list">

      <!-- 店舗1：利宝阁 -->
      <article class="yumcha-card">
        <!-- スライドショー -->
        <div class="slider-container" id="slider1">
          <div class="slider-wrapper">
            <img src="images/li_bao_ge_1.jpg" alt="利宝阁 1" class="slide active">
            <img src="images/li_bao_ge_2.jpg" alt="利宝阁 2" class="slide">
            <img src="images/li_bao_ge_3.jpg" alt="利宝阁 3" class="slide">
          </div>
          <button class="prev-btn" onclick="moveSlide('slider1', -1)">‹</button>
          <button class="next-btn" onclick="moveSlide('slider1', 1)">›</button>
          <div class="dots-container">
            <span class="dot active" onclick="setSlide('slider1', 0)"></span>
            <span class="dot" onclick="setSlide('slider1', 1)"></span>
            <span class="dot" onclick="setSlide('slider1', 2)"></span>
          </div>
        </div>

        <!-- 詳細情報 -->
        <div class="yumcha-info">
          <h2 class="yumcha-name">
            利宝阁 <span class="branch-name">嘉里建設広場店</span>
          </h2>
          <div class="yumcha-meta">
            <p><strong>営業時間：</strong>9:00〜</p>
            <p><strong>アクセス：</strong>ホテルから徒歩23分 (1.3km)</p>
          </div>
        </div>
      </article>

      <!-- 店舗2：陶陶居酒家 -->
      <article class="yumcha-card">
        <!-- スライドショー -->
        <div class="slider-container" id="slider2">
          <div class="slider-wrapper">
            <img src="images/tao_tao_ju_1.jpg" alt="陶陶居 1" class="slide active">
            <img src="images/tao_tao_ju_2.jpg" alt="陶陶居 2" class="slide">
            <img src="images/tao_tao_ju_3.jpg" alt="陶陶居 3" class="slide">
          </div>
          <button class="prev-btn" onclick="moveSlide('slider2', -1)">‹</button>
          <button class="next-btn" onclick="moveSlide('slider2', 1)">›</button>
          <div class="dots-container">
            <span class="dot active" onclick="setSlide('slider2', 0)"></span>
            <span class="dot" onclick="setSlide('slider2', 1)"></span>
            <span class="dot" onclick="setSlide('slider2', 2)"></span>
          </div>
        </div>

        <!-- 詳細情報 -->
        <div class="yumcha-info">
          <h2 class="yumcha-name">
            陶陶居酒家 <span class="branch-name">卓悦中心店</span>
          </h2>
          <div class="yumcha-meta">
            <p><strong>営業時間：</strong>10:00〜</p>
            <p><strong>アクセス：</strong>ホテルから徒歩30分 (1.8km)</p>
          </div>
        </div>
      </article>

    </div>

    <div class="back-link">
      <a href="day1.html">← BACK TO DAY 1</a>
    </div>

  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    // スライドショー制御用ロジック
    const slideIndexes = {
      slider1: 0,
      slider2: 0
    };

    function showSlide(sliderId, index) {
      const slider = document.getElementById(sliderId);
      const slides = slider.querySelectorAll('.slide');
      const dots = slider.querySelectorAll('.dot');
      
      if (index >= slides.length) slideIndexes[sliderId] = 0;
      else if (index < 0) slideIndexes[sliderId] = slides.length - 1;
      else slideIndexes[sliderId] = index;

      const currentIndex = slideIndexes[sliderId];

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentIndex);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function moveSlide(sliderId, step) {
      showSlide(sliderId, slideIndexes[sliderId] + step);
    }

    function setSlide(sliderId, index) {
      showSlide(sliderId, index);
    }
  </script>
</body>
</html>
