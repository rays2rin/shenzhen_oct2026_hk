<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAY 3 - Shenzhen & Hong Kong</title>

  <!-- フォントの軽量読み込み (必要なウェイトのみ指定) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f6f8fb;
      color: #202A3A; /* 基本文字：濃いネイビー */
      font-family: 'Noto Sans JP', sans-serif; /* 日本語本文 */
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ナビゲーションバー */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #edf2f7;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-icon {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bar {
      width: 20px;
      height: 2px;
      background-color: #202A3A;
      border-radius: 2px;
    }

    .site-title {
      font-family: 'Cinzel', serif; /* 英字タイトル: Serif */
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #202A3A;
    }

    /* ドロワーメニュー */
    .drawer-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background-color: #ffffff;
      z-index: 300;
      transition: left 0.3s ease;
      padding: 24px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }

    .drawer-menu.active { left: 0; }

    .close-btn {
      font-size: 20px;
      cursor: pointer;
      text-align: right;
      margin-bottom: 20px;
      color: #718096;
    }

    .drawer-menu ul { list-style: none; }
    .drawer-menu li { margin-bottom: 16px; }
    .drawer-menu a {
      text-decoration: none;
      color: #202A3A;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .drawer-menu .divider {
      height: 1px;
      background-color: #edf2f7;
      margin: 16px 0;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      display: none;
    }
    .overlay.active { display: block; }

    /* メインレイアウト */
    .page-container {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 16px 40px 16px;
    }

    /* ヘッダー */
    .schedule-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .schedule-sub {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #718096;
      margin-bottom: 4px;
    }

    .schedule-title {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      font-weight: 700;
      color: #202A3A;
      letter-spacing: 1px;
    }

    .schedule-date {
      font-family: 'Cinzel', serif; /* 数字・英字 */
      font-size: 13px;
      font-weight: 500;
      color: rgba(32, 42, 58, 0.65);
      margin-top: 2px;
    }

    /* タイムラインコンテナ */
    .timeline-container {
      position: relative;
      padding-left: 22px;
    }

    /* 左側の縦線 */
    .timeline-container::before {
      content: '';
      position: absolute;
      left: 2px;
      top: 14px;
      bottom: 16px;
      width: 1px;
      background-color: #e2e8f0;
    }

    /* タイムラインカード */
    .timeline-item {
      position: relative;
      margin-bottom: 10px;
    }

    /* 極小化した丸ノード (5px) */
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 16px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 1.5px solid #3d617c;
      z-index: 2;
    }

    /* カード（薄い枠線） */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px 16px;
      border: 1px solid rgba(226, 232, 240, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.015);
    }

    /* 時刻：数字Serif / ネイビー薄め */
    .time {
      font-family: 'Cinzel', serif; /* 数字: Serif */
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(32, 42, 58, 0.6);
      display: block;
      margin-bottom: 2px;
    }

    /* リンク：ブルーグレー (#3d617c) */
    .place-link {
      font-size: 14.5px;
      font-weight: 700;
      color: #3d617c;
      text-decoration: none;
      display: inline-block;
      line-height: 1.35;
    }

    .place-link:hover {
      text-decoration: underline;
    }

    /* 行動テキスト（基本ネイビー） */
    .action-text {
      font-size: 14px;
      font-weight: 500;
      color: #202A3A;
      display: block;
      line-height: 1.35;
    }

    /* 補足テキスト（ライトグレー） */
    .note-text {
      font-size: 11px;
      color: #718096;
      margin-top: 2px;
      display: block;
      line-height: 1.3;
    }

    /* バックリンク */
    .back-link {
      margin-top: 28px;
      text-align: center;
    }

    .back-link a {
      font-family: 'Cinzel', serif;
      color: #718096;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <!-- ドロワーメニュー -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <!-- バックドロップ -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- メインコンテンツ -->
  <main class="page-container">
    
    <!-- タイトルヘッダー -->
    <div class="schedule-header">
      <p class="schedule-sub">TRAVEL SCHEDULE</p>
      <h1 class="schedule-title">DAY 3</h1>
      <p class="schedule-date">October 2026</p>
    </div>

    <!-- タイムラインエリア -->
    <div class="timeline-container">

      <!-- 1. flex time -->
      <div class="timeline-item">
        <div class="card">
          <span class="time">09:00 - 12:00</span>
          <span class="action-text">flex time</span>
          <span class="note-text">※DAY 2の夜に相談（再訪、買い物、他スポット等）</span>
        </div>
      </div>

      <!-- 2. ランチ -->
      <div class="timeline-item">
        <div class="card">
          <span class="time">12:00</span>
          <a class="place-link" href="foods.html">ランチ</a>
        </div>
      </div>

      <!-- 3. 深圳宝安国際空港 到着 -->
      <div class="timeline-item">
        <div class="card">
          <span class="time">14:00</span>
          <span class="action-text">深圳宝安国際空港 到着</span>
        </div>
      </div>

      <!-- 4. 搭乗 (NH966) -->
      <div class="timeline-item">
        <div class="card">
          <span class="time">17:00</span>
          <span class="action-text">搭乗 (NH966)</span>
        </div>
      </div>

      <!-- 5. 羽田空港 到着 -->
      <div class="timeline-item">
        <div class="card">
          <span class="time">22:10</span>
          <span class="action-text">羽田空港 到着</span>
        </div>
      </div>

    </div>

    <div class="back-link">
      <a href="index.html">← TOP PAGE</a>
    </div>

  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
  </script>
</body>
</html>
