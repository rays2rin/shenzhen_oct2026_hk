<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXPENSES - Shenzhen & Hong Kong</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 予算計算用スタイル */
    .expense-select {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      background-color: #f8fafc;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      outline: none;
      margin-top: 4px;
      cursor: pointer;
    }
    .expense-select:focus {
      border-color: #4299e1;
      background-color: #ffffff;
    }
    .total-box {
      background: linear-gradient(135deg, #4299e1, #3182ce);
      color: #ffffff;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(66, 153, 225, 0.2);
    }
    .total-title {
      font-size: 12px;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .total-amount {
      font-size: 28px;
      font-weight: 700;
    }
    .expense-fixed-amount {
      font-size: 15px;
      font-weight: 600;
      color: #2d3748;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <!-- ドロワーメニュー -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <!-- バックドロップ -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- メインコンテンツ -->
  <main class="page-container">
    
    <!-- タイトルヘッダー -->
    <div class="schedule-header">
      <p class="schedule-sub">ESTIMATED BUDGET</p>
      <h1 class="schedule-title">EXPENSES</h1>
    </div>

    <!-- 合計金額表示エリア -->
    <div class="total-box">
      <div class="total-title">ESTIMATED TOTAL / PER PERSON</div>
      <div class="total-amount" id="totalAmount">¥0</div>
    </div>

    <!-- 費用項目リスト -->
    <div class="schedule-list">

      <!-- 飛行機代 -->
      <div class="schedule-card" style="flex-direction: column; align-items: flex-start; gap: 4px;">
        <span class="time" style="font-size: 12px; color: #718096;">FLIGHT</span>
        <span class="text" style="font-weight: 600;">飛行機代</span>
        <div class="expense-fixed-amount">¥<span class="calc-item" data-value="45000">45,000</span></div>
      </div>

      <!-- ホテル代 -->
      <div class="schedule-card" style="flex-direction: column; align-items: flex-start; gap: 4px;">
        <span class="time" style="font-size: 12px; color: #718096;">HOTEL</span>
        <span class="text" style="font-weight: 600;">ホテル代 (2泊)</span>
        <div class="expense-fixed-amount">¥<span class="calc-item" data-value="20000">20,000</span></div>
      </div>

      <!-- 食事代 (選択式) -->
      <div class="schedule-card" style="flex-direction: column; align-items: flex-start; gap: 4px;">
        <span class="time" style="font-size: 12px; color: #718096;">FOOD & DRINK</span>
        <span class="text" style="font-weight: 600;">食事代（概算）</span>
        <select class="expense-select calc-select" id="foodSelect" onchange="calculateTotal()">
          <option value="10000">¥10,000</option>
          <option value="15000" selected>¥15,000 (推奨)</option>
          <option value="20000">¥20,000</option>
        </select>
      </div>

      <!-- タクシー代 (選択式) -->
      <div class="schedule-card" style="flex-direction: column; align-items: flex-start; gap: 4px;">
        <span class="time" style="font-size: 12px; color: #718096;">TAXI & TRANSPORT</span>
        <span class="text" style="font-weight: 600;">タクシー・交通費</span>
        <select class="expense-select calc-select" id="taxiSelect" onchange="calculateTotal()">
          <option value="10000" selected>¥10,000</option>
          <option value="15000">¥15,000</option>
          <option value="20000">¥20,000</option>
        </select>
      </div>

      <!-- 予備費・その他 -->
      <div class="schedule-card" style="flex-direction: column; align-items: flex-start; gap: 4px;">
        <span class="time" style="font-size: 12px; color: #718096;">OTHERS</span>
        <span class="text" style="font-weight: 600;">お土産・観光・予備費</span>
        <div class="expense-fixed-amount">¥<span class="calc-item" data-value="10000">10,000</span></div>
      </div>

    </div>

    <div class="back-link">
      <a href="index.html">← TOP PAGE</a>
    </div>

  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    // 自動計算機能
    function calculateTotal() {
      let total = 0;

      // 固定金額の合算 (飛行機、ホテル、予備費)
      const fixedItems = document.querySelectorAll('.calc-item');
      fixedItems.forEach(item => {
        total += parseInt(item.getAttribute('data-value'), 10) || 0;
      });

      // 選択式金額の合算 (食事、タクシー)
      const selectItems = document.querySelectorAll('.calc-select');
      selectItems.forEach(select => {
        total += parseInt(select.value, 10) || 0;
      });

      // 3桁カンマ区切りで表示
      document.getElementById('totalAmount').textContent = '¥' + total.toLocaleString();
    }

    // ページ読み込み時に初期計算を実行
    document.addEventListener('DOMContentLoaded', calculateTotal);
  </script>
</body>
</html>
