<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXPENSES - SHENZHEN & HONG KONG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* 全体リセット & ダークモード基調 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d !important;
      color: #ffffff !important;
      font-family: 'Montserrat', -apple-system, sans-serif !important;
      min-height: 100vh;
      padding: 20px 20px 40px 20px;
    }

    /* ヘッダー */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 440px;
      margin: 0 auto 28px auto;
    }

    .back-link {
      color: #8e8e93;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #0a84ff; /* 青アクセント */
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: #ffffff;
    }

    /* メインコンテナ */
    .expenses-container {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 1. 青カード廃止・ダークガラス調の合計金額エリア */
    .total-display-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 20px 20px 20px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    /* 3. ESTIMATED TOTAL（小さく控えめに） */
    .estimated-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #8e8e93;
      display: block;
      margin-bottom: 6px;
    }

    /* 2. 合計金額（ページの視覚的主役・特大化） */
    .total-amount-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      margin-bottom: 20px;
    }

    .currency-symbol {
      font-size: 28px;
      font-weight: 600;
      color: #0a84ff; /* 青アクセント */
    }

    .total-amount {
      font-size: 48px; /* 主役サイズ */
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      display: inline-block;
    }

    /* 4. 金額変更時の数字ポップアニメーション */
    .total-amount.pop-anim {
      animation: numPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes numPop {
      0% {
        opacity: 0.3;
        transform: scale(0.92) translateY(4px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* 5. 通貨トグル（青はテキスト・薄枠線などのアクセントに限定） */
    .currency-toggle {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      gap: 4px;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: #8e8e93;
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      color: #0a84ff; /* 青テキスト */
      background: rgba(10, 132, 255, 0.12); /* 青アクセント背景 */
      border: 1px solid rgba(10, 132, 255, 0.3); /* 青線 */
    }

    /* BREAKDOWN 明細リスト */
    .expenses-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #8e8e93;
      margin: 0 0 4px 4px;
    }

    .expense-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .item-sub {
      font-size: 11px;
      color: #6c6c70;
    }

    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body class="expenses-page">

  <header class="page-header">
    <a href="index.html" class="back-link">← TOP</a>
    <h1 class="page-title">EXPENSES</h1>
  </header>

  <main class="expenses-container">

    <section class="total-display-card">
      <span class="estimated-label">ESTIMATED TOTAL</span>
      <div class="total-amount-box">
        <span class="currency-symbol" id="currencySymbol">¥</span>
        <span class="total-amount" id="totalAmount">39,500</span>
      </div>
      
      <div class="currency-toggle">
        <button class="toggle-btn active" id="btnJPY" onclick="switchCurrency('JPY')">JPY (¥)</button>
        <button class="toggle-btn" id="btnHKD" onclick="switchCurrency('HKD')">HKD ($)</button>
        <button class="toggle-btn" id="btnCNY" onclick="switchCurrency('CNY')">CNY (¥)</button>
      </div>
    </section>

    <section class="expenses-list">
      <h2 class="section-subtitle">BREAKDOWN</h2>
      
      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">交通費（MTR・フェリー等）</span>
          <span class="item-sub">交通カード・移動費合計</span>
        </div>
        <div class="item-price" data-jpy="8500" data-hkd="425" data-cny="400">¥8,500</div>
      </div>

      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">食費（飲茶・ローカルフード）</span>
          <span class="item-sub">全日程の食事概算</span>
        </div>
        <div class="item-price" data-jpy="15000" data-hkd="750" data-cny="700">¥15,000</div>
      </div>

      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">観光・入場料</span>
          <span class="item-sub">施設利用料など</span>
        </div>
        <div class="item-price" data-jpy="6000" data-hkd="300" data-cny="280">¥6,000</div>
      </div>

      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">予備費・お土産</span>
          <span class="item-sub">ショッピング・その他</span>
        </div>
        <div class="item-price" data-jpy="10000" data-hkd="500" data-cny="470">¥10,000</div>
      </div>
    </section>

  </main>

  <script>
    let currentCurrency = 'JPY';

    function calculateTotal() {
      const items = document.querySelectorAll('.item-price');
      let total = 0;

      items.forEach(item => {
        const val = parseFloat(item.getAttribute(`data-${currentCurrency.toLowerCase()}`)) || 0;
        total += val;
        
        const symbol = currentCurrency === 'HKD' ? '$' : '¥';
        item.textContent = symbol + val.toLocaleString();
      });

      const totalEl = document.getElementById('totalAmount');
      const symbolEl = document.getElementById('currencySymbol');
      
      symbolEl.textContent = currentCurrency === 'HKD' ? '$' : '¥';
      totalEl.textContent = total.toLocaleString();

      // 数字のアニメーションリセット
      totalEl.classList.remove('pop-anim');
      void totalEl.offsetWidth;
      totalEl.classList.add('pop-anim');
    }

    function switchCurrency(type) {
      currentCurrency = type;
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn${type}`).classList.add('active');
      calculateTotal();
    }

    window.addEventListener('DOMContentLoaded', calculateTotal);
  </script>
</body>
</html>
