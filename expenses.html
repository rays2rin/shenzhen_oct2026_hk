<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXPENSES - SHENZHEN & HONG KONG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="sub-page expenses-page">

  <header class="page-header">
    <a href="index.html" class="back-link">← TOP</a>
    <h1 class="page-title">EXPENSES</h1>
  </header>

  <main class="expenses-container">

    <section class="total-display-card">
      <span class="estimated-label">ESTIMATED TOTAL</span>
      <div class="total-amount-box">
        <span class="currency-symbol" id="currencySymbol">¥</span>
        <span class="total-amount" id="totalAmount">0</span>
      </div>
      
      <div class="currency-toggle">
        <button class="toggle-btn active" id="btnJPY" onclick="switchCurrency('JPY')">JPY (¥)</button>
        <button class="toggle-btn" id="btnHKD" onclick="switchCurrency('HKD')">HKD ($)</button>
        <button class="toggle-btn" id="btnCNY" onclick="switchCurrency('CNY')">CNY (¥)</button>
      </div>
    </section>

    <section class="expenses-list">
      <h2 class="section-subtitle">BREAKDOWN</h2>
      
      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">交通費（MTR・フェリー等）</span>
          <span class="item-sub">交通カード・移動費合計</span>
        </div>
        <div class="item-price" data-jpy="8500" data-hkd="425" data-cny="400">¥8,500</div>
      </div>

      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">食費（飲茶・ローカルフード）</span>
          <span class="item-sub">全日程の食事概算</span>
        </div>
        <div class="item-price" data-jpy="15000" data-hkd="750" data-cny="700">¥15,000</div>
      </div>

      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">観光・入場料</span>
          <span class="item-sub">施設利用料など</span>
        </div>
        <div class="item-price" data-jpy="6000" data-hkd="300" data-cny="280">¥6,000</div>
      </div>

      <div class="expense-item">
        <div class="item-info">
          <span class="item-title">予備費・お土産</span>
          <span class="item-sub">ショッピング・その他</span>
        </div>
        <div class="item-price" data-jpy="10000" data-hkd="500" data-cny="470">¥10,000</div>
      </div>
    </section>

  </main>

  <script>
    // 1 HKD / CNY の簡易換算レート（表示保持用データ）
    const rates = { JPY: 1, HKD: 0.05, CNY: 0.047 };
    let currentCurrency = 'JPY';

    // 合計金額の計算・更新
    function calculateTotal() {
      const items = document.querySelectorAll('.item-price');
      let total = 0;

      items.forEach(item => {
        const val = parseFloat(item.getAttribute(`data-${currentCurrency.toLowerCase()}`)) || 0;
        total += val;
        
        // 明細リスト側の表示更新
        const symbol = currentCurrency === 'HKD' ? '$' : '¥';
        item.textContent = symbol + val.toLocaleString();
      });

      // 主役の合計金額を更新＆軽めのアニメーション発動
      const totalEl = document.getElementById('totalAmount');
      const symbolEl = document.getElementById('currencySymbol');
      
      symbolEl.textContent = currentCurrency === 'HKD' ? '$' : '¥';
      totalEl.textContent = total.toLocaleString();

      // 数字のアニメーションリセット
      totalEl.classList.remove('pop-anim');
      void totalEl.offsetWidth; // リフロー発生
      totalEl.classList.add('pop-anim');
    }

    // 通貨切り替え
    function switchCurrency(type) {
      currentCurrency = type;
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn${type}`).classList.add('active');
      calculateTotal();
    }

    // 初期計算
    window.addEventListener('DOMContentLoaded', calculateTotal);
  </script>
</body>
</html>
