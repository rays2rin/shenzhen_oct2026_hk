<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO - Shenzhen & Hong Kong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ナビゲーションバー -->
  <header class="navbar">
    <div class="menu-icon" onclick="toggleMenu()">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
    <div class="site-title"><a href="index.html" style="text-decoration:none; color:inherit;">SHENZHEN & HONG KONG</a></div>
  </header>

  <!-- ドロワーメニュー -->
  <nav class="drawer-menu" id="drawerMenu">
    <div class="close-btn" onclick="toggleMenu()">✕</div>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="day1.html">DAY 1</a></li>
      <li><a href="day2.html">DAY 2</a></li>
      <li><a href="day3.html">DAY 3</a></li>
      <li class="divider"></li>
      <li><a href="todo.html">todo</a></li>
      <li><a href="expenses.html">expenses</a></li>
      <li><a href="traffic.html">traffic</a></li>
      <li><a href="foods.html">foods</a></li>
    </ul>
  </nav>

  <!-- バックドロップ -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- メインコンテンツ -->
  <main class="page-container">
    
    <!-- タイトルヘッダー -->
    <div class="schedule-header">
      <p class="schedule-sub">CHECKLIST</p>
      <h1 class="schedule-title">TO DO & PACKING</h1>
    </div>

    <!-- 事前準備リスト -->
    <section class="todo-section">
      <h2 class="todo-section-title">PREPARATION</h2>
      
      <div class="todo-card-list">

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">eSIM購入</span>
            <p class="todo-desc">
              ・番号不要：<a href="https://esim.holafly.com/ja/" target="_blank">Holafly</a>（コード <code>ONODA</code>）<br>
              ・番号必要：<a href="https://chocosim.net/" target="_blank">チョコSIM90</a>
            </p>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">旅行保険の加入</span>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">オンライン入国カード作成</span>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">WeChat 登録</span>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">Alipay 登録</span>
          </div>
        </label>

      </div>
    </section>

    <!-- 持ち物リスト -->
    <section class="todo-section">
      <h2 class="todo-section-title">PACKING LIST</h2>
      
      <div class="todo-card-list">

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">パスポート</span>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">充電器</span>
            <p class="todo-desc">予備としてケーブル2本</p>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">モバイルバッテリー</span>
            <p class="todo-desc">43,200mAh以下</p>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">メガネ / コンタクト / 薬</span>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">クレジットカード</span>
          </div>
        </label>

        <label class="todo-card">
          <input type="checkbox" class="todo-checkbox">
          <span class="custom-check"></span>
          <div class="todo-content">
            <span class="todo-title">現金</span>
            <p class="todo-desc">香港で必要</p>
          </div>
        </label>

      </div>
    </section>

    <div class="back-link">
      <a href="index.html">← TOP PAGE</a>
    </div>

  </main>

  <script>
    function toggleMenu() {
      document.getElementById('drawerMenu').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }
  </script>
</body>
</html>
